<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Chuyển địa chỉ tra code SRU</title>
  <style>
    :root { color-scheme:light; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color:#172b40; background:#f0f4f8; }
    *, *:before, *:after { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; }
    .card { width:min(100%, 590px); padding:clamp(22px, 5vw, 38px); background:#fff; border:1px solid #dfe7ef; border-radius:22px; box-shadow:0 14px 48px rgba(24,48,80,.09); }
    .badge { display:inline-block; font-weight:700; color:#0a6c55; font-size:.78rem; letter-spacing:.07em; background:#e6f5ef; border-radius:100px; padding:7px 12px; }
    h1 { font-size:clamp(1.35rem, 5vw, 1.8rem); line-height:1.27; letter-spacing:-.025em; margin:18px 0 17px; }
    .notice { color:#42566b; font-size:1rem; line-height:1.7; margin:0 0 22px; }
    .notice strong { color:#1c3045; }
    .address { display:block; overflow-wrap:anywhere; font-weight:700; color:#1658aa; text-decoration:none; background:#f2f7fc; padding:15px 17px; border:1px solid #d7e5f3; border-radius:12px; margin:10px 0 23px; }
    .address:hover { background:#eaf3fc; text-decoration:underline; }
    .section-title { font-weight:700; font-size:1rem; margin:0 0 13px; }
    .field { margin:13px 0; }
    .field-label { display:block; margin-bottom:6px; color:#586b80; font-size:.83rem; font-weight:650; }
    .value-row { display:flex; align-items:center; gap:10px; border:1px solid #dee6ee; background:#fafbfd; min-height:54px; border-radius:11px; padding:7px 8px 7px 15px; }
    .value { flex:1; min-width:0; font-size:1.03rem; font-weight:700; overflow-wrap:anywhere; }
    .copy { cursor:pointer; border:1px solid #d7e2ed; background:#fff; color:#20588b; border-radius:8px; padding:9px 12px; font-weight:650; white-space:nowrap; }
    .copy:hover { background:#eaf2fa; }
    .login { display:block; text-align:center; border-radius:12px; padding:15px 20px; margin-top:24px; background:#1769be; color:#fff; font-weight:750; text-decoration:none; }
    .login:hover { background:#10579f; }
    .note { font-size:.78rem; color:#788695; margin:17px 0 0; line-height:1.5; }
  </style>
</head>
<body>
  <main class="card">
    <p class="notice">Hiện tại, trang web <strong>tra code SRU</strong>chuyển sang địa chỉ:</p>
    <a class="address" href="https://namllp.infinityfree.io/public/" target="_blank" rel="noopener noreferrer">https://namllp.infinityfree.io/public/</a>
    <p class="section-title">Sử dụng tài khoản và mật khẩu dưới đây để đăng nhập:</p>
    <div class="field">
      <span class="field-label">User</span>
      <div class="value-row"><span class="value">user</span><button type="button" class="copy" data-copy="user">Sao chép</button></div>
    </div>
    <div class="field">
      <span class="field-label">Password</span>
      <div class="value-row"><span class="value">0123456789</span><button type="button" class="copy" data-copy="0123456789">Sao chép</button></div>
    </div>
    <a class="login" href="https://namllp.infinityfree.io/public/login.php" target="_blank" rel="noopener noreferrer">Đến trang đăng nhập</a>
  </main>
  <script>
    document.querySelectorAll('[data-copy]').forEach(button => {
      button.addEventListener('click', async () => {
        const text = button.getAttribute('data-copy');
        let success = false;
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            success = true;
          } else {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            success = document.execCommand('copy');
            textarea.remove();
          }
        } catch (_) {}
        button.textContent = success ? 'Đã sao chép ✓' : 'Không thể sao chép';
        window.setTimeout(() => button.textContent = 'Sao chép', 1800);
      });
    });
  </script>
</body>
</html>
